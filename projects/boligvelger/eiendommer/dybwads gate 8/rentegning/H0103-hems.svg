<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 213 239">
  <!-- H0103 hems: over bad, ca 3,8 m². Mål i cm, samme orientering som hovedplan.
       Tilkomst via stige fra gang (østsiden). -->
  <rect x="11" y="11" width="191" height="217" fill="#E5D3BC"/>
  <rect x="11" y="11" width="191" height="217" fill="none" stroke="#1A1A18" stroke-width="8"/>
  <!-- Luke/åpning mot stige (SØ-hjørne, mot gang) -->
  <rect x="126" y="170" width="70" height="48" fill="none" stroke="#1A1A18"
        stroke-width="1" stroke-dasharray="4 3"/>
  <g font-family="Helvetica" fill="#1A1A18">
    <text x="106" y="110" font-size="13" text-anchor="middle">Hems</text>
    <text x="106" y="127" font-size="10" text-anchor="middle" opacity="0.65">ca 3,8 m²</text>
  </g>
</svg>
