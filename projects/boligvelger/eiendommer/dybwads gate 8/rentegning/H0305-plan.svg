<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 410">
  <!-- H0305: Stue/sov 16,3 + Gang 1,7 + Bad 3,5. Mål i cm. Origo = ytre NV-hjørne. -->

  <!-- Romflater -->
  <rect x="22" y="40" width="438" height="353" fill="#F4F1E8"/>            <!-- Stue/sov -->
  <rect x="460" y="22" width="200" height="128" fill="#F4F1E8"/>          <!-- Gang -->
  <rect x="460" y="150" width="200" height="243" fill="#DCE2D6"/>         <!-- Bad -->

  <!-- Flisraster bad (20x20) -->
  <g stroke="#1A1A18" stroke-width="0.35" opacity="0.5">
    <line x1="480" y1="150" x2="480" y2="393"/><line x1="500" y1="150" x2="500" y2="393"/>
    <line x1="520" y1="150" x2="520" y2="393"/><line x1="540" y1="150" x2="540" y2="393"/>
    <line x1="560" y1="150" x2="560" y2="393"/><line x1="580" y1="150" x2="580" y2="393"/>
    <line x1="600" y1="150" x2="600" y2="393"/><line x1="620" y1="150" x2="620" y2="393"/>
    <line x1="640" y1="150" x2="640" y2="393"/>
    <line x1="460" y1="170" x2="660" y2="170"/><line x1="460" y1="190" x2="660" y2="190"/>
    <line x1="460" y1="210" x2="660" y2="210"/><line x1="460" y1="230" x2="660" y2="230"/>
    <line x1="460" y1="250" x2="660" y2="250"/><line x1="460" y1="270" x2="660" y2="270"/>
    <line x1="460" y1="290" x2="660" y2="290"/><line x1="460" y1="310" x2="660" y2="310"/>
    <line x1="460" y1="330" x2="660" y2="330"/><line x1="460" y1="350" x2="660" y2="350"/>
    <line x1="460" y1="370" x2="660" y2="370"/>
  </g>

  <!-- Hems-avgrensning over gang+bad (stiplet) -->
  <rect x="454" y="22" width="212" height="371" fill="none" stroke="#1A1A18"
        stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- Innervegger -->
  <line x1="460" y1="22" x2="460" y2="393" stroke="#1A1A18" stroke-width="14"/>  <!-- stue/gang-bad -->
  <line x1="460" y1="150" x2="666" y2="150" stroke="#1A1A18" stroke-width="12"/> <!-- gang/bad, åpning vest for dør -->

  <!-- Dør gang->stue (i skillevegg, åpning y 40..115, hengslet nord, slår inn i stue) -->
  <line x1="460" y1="40" x2="460" y2="115" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 460 115 A 75 75 0 0 1 385 40" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Dør gang->bad (i skillevegg, hengslet vest, slår opp i gang) -->
  <line x1="468" y1="150" x2="543" y2="150" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 543 150 A 75 75 0 0 0 468 75" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Stige til hems (Stue-siden av skillevegg) -->
  <g stroke="#1A1A18" stroke-width="0.9" fill="none">
    <rect x="448" y="175" width="12" height="60"/>
    <line x1="448" y1="190" x2="460" y2="190"/><line x1="448" y1="205" x2="460" y2="205"/>
    <line x1="448" y1="220" x2="460" y2="220"/>
  </g>

  <!-- Bad-innredning -->
  <use href="#servant" x="470" y="205"/>
  <use href="#wc" x="540" y="200"/>

  <!-- Kjøkkenbenk langs sørvegg i stue -->
  <use href="#komfyr" x="175" y="333"/>
  <use href="#kvask" x="305" y="333"/>

  <!-- Møblering stue -->
  <use href="#sofa" x="35" y="95"/>
  <use href="#bord2" x="225" y="48"/>

  <!-- Yttervegger -->
  <line x1="0" y1="11" x2="460" y2="11" stroke="#1A1A18" stroke-width="22"/>     <!-- nord -->
  <line x1="0" y1="399" x2="460" y2="399" stroke="#1A1A18" stroke-width="22"/>   <!-- sør -->
  <line x1="9" y1="0" x2="9" y2="410" stroke="#1A1A18" stroke-width="18"/>       <!-- vest (Dybwads gate) -->

  <!-- Vindu vestfasade -->
  <line x1="9" y1="127" x2="9" y2="292" stroke="#FBFAF6" stroke-width="20"/>
  <line x1="1" y1="127" x2="1" y2="292" stroke="#1A1A18" stroke-width="2"/>
  <line x1="17" y1="127" x2="17" y2="292" stroke="#1A1A18" stroke-width="2"/>

  <!-- Rom-labels -->
  <g font-family="Helvetica" fill="#1A1A18">
    <text x="240" y="210" font-size="13" text-anchor="middle">Stue/sov</text>
    <text x="240" y="227" font-size="10" text-anchor="middle" opacity="0.65">16,3 m²</text>
    <text x="335" y="328" font-size="11" text-anchor="middle">Kjøkken</text>
    <text x="560" y="95" font-size="13" text-anchor="middle">Gang</text>
    <text x="560" y="112" font-size="10" text-anchor="middle" opacity="0.65">1,7 m²</text>
    <text x="560" y="262" font-size="13" text-anchor="middle">Bad</text>
    <text x="560" y="279" font-size="10" text-anchor="middle" opacity="0.65">3,5 m²</text>
  </g>
</svg>
