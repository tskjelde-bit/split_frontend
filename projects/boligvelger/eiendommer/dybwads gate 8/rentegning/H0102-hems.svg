<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 398 259">
  <!-- H0102 hems: over bad + del av gang, ca 5,5 m². Mål i cm, samme orientering som hovedplan. -->
  <rect x="11" y="11" width="376" height="237" fill="#E5D3BC"/>
  <rect x="11" y="11" width="376" height="237" fill="none" stroke="#1A1A18" stroke-width="8"/>
  <!-- Skrå himling / hems-grense (stiplet diagonal, samme som arkitekttegning) -->
  <line x1="11" y1="248" x2="300" y2="11" stroke="#1A1A18" stroke-width="1" stroke-dasharray="6 4"/>
  <!-- Luke/åpning mot stige (NØ-hjørne, mot østvegg) -->
  <rect x="320" y="16" width="55" height="40" fill="none" stroke="#1A1A18"
        stroke-width="1" stroke-dasharray="4 3"/>
  <g font-family="Helvetica" fill="#1A1A18">
    <text x="150" y="135" font-size="13" text-anchor="middle">Hems</text>
    <text x="150" y="152" font-size="10" text-anchor="middle" opacity="0.65">ca 5,5 m²</text>
  </g>
</svg>
