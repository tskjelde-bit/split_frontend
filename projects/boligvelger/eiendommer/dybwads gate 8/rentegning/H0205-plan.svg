<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 685">
  <!-- H0205: Stue/sov 19,8 + Gang 5,3 + Bad 4,2 + BK 2,3. Mål i cm. Origo = ytre NV-hjørne. -->

  <!-- Romflater -->
  <rect x="20" y="20" width="491" height="536" fill="#F4F1E8"/>          <!-- Stue/sov + Gang (åpen plan) -->
  <rect x="511" y="154" width="39" height="329" fill="#F4F1E8"/>        <!-- korridor-strip -->
  <path d="M 550 394 L 691 489 L 850 489 L 850 667 L 550 667 Z" fill="#DCE2D6"/>  <!-- Bad -->
  <rect x="537" y="20" width="121" height="134" fill="#F4F1E8"/>        <!-- BK -->

  <!-- Flisraster bad (20x20), klippet til badform -->
  <clipPath id="badclip"><path d="M 550 394 L 691 489 L 850 489 L 850 667 L 550 667 Z"/></clipPath>
  <g stroke="#1A1A18" stroke-width="0.35" opacity="0.5" clip-path="url(#badclip)">
    <line x1="570" y1="394" x2="570" y2="667"/><line x1="590" y1="394" x2="590" y2="667"/>
    <line x1="610" y1="394" x2="610" y2="667"/><line x1="630" y1="394" x2="630" y2="667"/>
    <line x1="650" y1="394" x2="650" y2="667"/><line x1="670" y1="394" x2="670" y2="667"/>
    <line x1="690" y1="394" x2="690" y2="667"/><line x1="710" y1="394" x2="710" y2="667"/>
    <line x1="730" y1="394" x2="730" y2="667"/><line x1="750" y1="394" x2="750" y2="667"/>
    <line x1="770" y1="394" x2="770" y2="667"/><line x1="790" y1="394" x2="790" y2="667"/>
    <line x1="810" y1="394" x2="810" y2="667"/><line x1="830" y1="394" x2="830" y2="667"/>
    <line x1="550" y1="500" x2="850" y2="500"/><line x1="550" y1="520" x2="850" y2="520"/>
    <line x1="550" y1="540" x2="850" y2="540"/><line x1="550" y1="560" x2="850" y2="560"/>
    <line x1="550" y1="580" x2="850" y2="580"/><line x1="550" y1="600" x2="850" y2="600"/>
    <line x1="550" y1="620" x2="850" y2="620"/><line x1="550" y1="640" x2="850" y2="640"/>
    <line x1="550" y1="660" x2="850" y2="660"/>
  </g>

  <!-- Hems-avgrensning (skrå stiplet linje, loft over kjøkken/gang NØ) -->
  <line x1="485" y1="248" x2="345" y2="578" stroke="#1A1A18"
        stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="410" y="500" font-family="Helvetica" font-size="10" fill="#1A1A18"
        opacity="0.7" transform="rotate(-67 410 500)">Hems</text>

  <!-- Innervegger -->
  <line x1="511" y1="20" x2="511" y2="556" stroke="#1A1A18" stroke-width="12"/>  <!-- hovedrom/korridor-strip øst -->
  <line x1="537" y1="20" x2="537" y2="154" stroke="#1A1A18" stroke-width="11"/>  <!-- BK vest -->
  <line x1="658" y1="20" x2="658" y2="154" stroke="#1A1A18" stroke-width="12"/>  <!-- BK øst -->
  <line x1="537" y1="154" x2="658" y2="154" stroke="#1A1A18" stroke-width="11"/> <!-- BK sør -->
  <line x1="550" y1="394" x2="550" y2="667" stroke="#1A1A18" stroke-width="12"/> <!-- bad vest -->
  <path d="M 550 394 L 691 489 L 850 489" fill="none" stroke="#1A1A18" stroke-width="12"/> <!-- bad nord (skrå) -->

  <!-- Dør hovedrom->korridor (åpning i vegg x511, hengslet, slår inn i hovedrom) -->
  <line x1="511" y1="193" x2="511" y2="270" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 511 270 A 77 77 0 0 1 434 193" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Dør korridor->BK (i BK sørvegg, hengslet, slår inn i BK) -->
  <line x1="640" y1="154" x2="582" y2="154" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 582 154 A 58 58 0 0 1 640 96" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Dør korridor->bad (i bad vestvegg, hengslet, slår inn i bad) -->
  <line x1="550" y1="420" x2="550" y2="496" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 550 496 A 76 76 0 0 1 626 420" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Sittebenk langs nordvegg -->
  <rect x="40" y="24" width="320" height="62" fill="none" stroke="#1A1A18" stroke-width="1"/>
  <text x="200" y="60" font-family="Helvetica" font-size="11" text-anchor="middle" fill="#1A1A18">Sittebenk</text>

  <!-- Kjøkken (benk + vask langs nordvegg, øst for sittebenk) -->
  <rect x="360" y="24" width="151" height="62" fill="none" stroke="#1A1A18" stroke-width="1"/>
  <use href="#kvask" x="386" y="26"/>
  <text x="435" y="105" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#1A1A18">Kjøkken</text>

  <!-- Stige til hems (skyves ut etter behov) -->
  <g stroke="#1A1A18" stroke-width="0.9" fill="none">
    <rect x="436" y="182" width="60" height="14"/>
    <line x1="451" y1="182" x2="451" y2="196"/><line x1="466" y1="182" x2="466" y2="196"/>
    <line x1="481" y1="182" x2="481" y2="196"/>
  </g>

  <!-- BK-innredning (utslagsvask) -->
  <use href="#servant" x="576" y="28"/>

  <!-- Bad-innredning -->
  <use href="#wc" x="585" y="575"/>
  <use href="#servant" x="640" y="540"/>

  <!-- Møblering hovedrom -->
  <use href="#sofa" x="40" y="430"/>
  <use href="#bord2" x="250" y="280"/>

  <!-- Yttervegger -->
  <line x1="0" y1="10" x2="511" y2="10" stroke="#1A1A18" stroke-width="20"/>     <!-- nord -->
  <line x1="10" y1="0" x2="10" y2="556" stroke="#1A1A18" stroke-width="40"/>     <!-- vest (Dybwads gate) -->
  <line x1="0" y1="546" x2="511" y2="546" stroke="#1A1A18" stroke-width="28"/>   <!-- sør (hovedrom) -->
  <line x1="850" y1="489" x2="850" y2="667" stroke="#1A1A18" stroke-width="22"/> <!-- øst (bad/54db) -->
  <line x1="550" y1="667" x2="850" y2="667" stroke="#1A1A18" stroke-width="20"/> <!-- bad sør -->

  <!-- Vinduer vestfasade (mot Dybwads gate) -->
  <g>
    <line x1="10" y1="105" x2="10" y2="227" stroke="#FBFAF6" stroke-width="42"/>
    <line x1="2" y1="105" x2="2" y2="227" stroke="#1A1A18" stroke-width="2"/>
    <line x1="18" y1="105" x2="18" y2="227" stroke="#1A1A18" stroke-width="2"/>
    <line x1="10" y1="337" x2="10" y2="447" stroke="#FBFAF6" stroke-width="42"/>
    <line x1="2" y1="337" x2="2" y2="447" stroke="#1A1A18" stroke-width="2"/>
    <line x1="18" y1="337" x2="18" y2="447" stroke="#1A1A18" stroke-width="2"/>
    <line x1="10" y1="450" x2="10" y2="540" stroke="#FBFAF6" stroke-width="42"/>
    <line x1="2" y1="450" x2="2" y2="540" stroke="#1A1A18" stroke-width="2"/>
    <line x1="18" y1="450" x2="18" y2="540" stroke="#1A1A18" stroke-width="2"/>
  </g>

  <!-- Rom-labels -->
  <g font-family="Helvetica" fill="#1A1A18">
    <text x="230" y="350" font-size="13" text-anchor="middle">Stue/sov</text>
    <text x="230" y="367" font-size="10" text-anchor="middle" opacity="0.65">19,8 m²</text>
    <text x="430" y="430" font-size="13" text-anchor="middle">Gang</text>
    <text x="430" y="447" font-size="10" text-anchor="middle" opacity="0.65">5,3 m²</text>
    <text x="610" y="450" font-size="13" text-anchor="middle">Bad</text>
    <text x="610" y="467" font-size="10" text-anchor="middle" opacity="0.65">4,2 m²</text>
    <text x="615" y="95" font-size="11" text-anchor="middle">BK</text>
    <text x="615" y="110" font-size="9" text-anchor="middle" opacity="0.65">2,3 m²</text>
  </g>
</svg>
