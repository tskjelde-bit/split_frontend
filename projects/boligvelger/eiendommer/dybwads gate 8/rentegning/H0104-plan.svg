<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 586">
  <!-- H0104: Stue/sov 20,7 + Gang 4,1 + Bad 6,9. Alle mål i cm. Origo = ytre NV-hjørne. -->

  <!-- Romflater -->
  <rect x="41" y="20" width="341" height="508" fill="#F4F1E8"/>            <!-- Stue/sov -->
  <rect x="382" y="20" width="141" height="546" fill="#F4F1E8"/>          <!-- Gang -->
  <rect x="554" y="108" width="282" height="244" fill="#DCE2D6"/>         <!-- Bad -->

  <!-- Flisraster bad (20x20) -->
  <g stroke="#1A1A18" stroke-width="0.35" opacity="0.5">
    <line x1="574" y1="108" x2="574" y2="352"/><line x1="594" y1="108" x2="594" y2="352"/>
    <line x1="614" y1="108" x2="614" y2="352"/><line x1="634" y1="108" x2="634" y2="352"/>
    <line x1="654" y1="108" x2="654" y2="352"/><line x1="674" y1="108" x2="674" y2="352"/>
    <line x1="694" y1="108" x2="694" y2="352"/><line x1="714" y1="108" x2="714" y2="352"/>
    <line x1="734" y1="108" x2="734" y2="352"/><line x1="754" y1="108" x2="754" y2="352"/>
    <line x1="774" y1="108" x2="774" y2="352"/><line x1="794" y1="108" x2="794" y2="352"/>
    <line x1="814" y1="108" x2="814" y2="352"/>
    <line x1="554" y1="128" x2="836" y2="128"/><line x1="554" y1="148" x2="836" y2="148"/>
    <line x1="554" y1="168" x2="836" y2="168"/><line x1="554" y1="188" x2="836" y2="188"/>
    <line x1="554" y1="208" x2="836" y2="208"/><line x1="554" y1="228" x2="836" y2="228"/>
    <line x1="554" y1="248" x2="836" y2="248"/><line x1="554" y1="268" x2="836" y2="268"/>
    <line x1="554" y1="288" x2="836" y2="288"/><line x1="554" y1="308" x2="836" y2="308"/>
    <line x1="554" y1="328" x2="836" y2="328"/>
  </g>

  <!-- Hems-avgrensning (stiplet) over nedre del av Stue/sov -->
  <rect x="75" y="311" width="226" height="217" fill="none" stroke="#1A1A18"
        stroke-width="1.2" stroke-dasharray="6 4"/>
  <!-- Hems-skråtak-kant gjennom Gang (diagonal) -->
  <line x1="382" y1="335" x2="500" y2="566" stroke="#1A1A18"
        stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Innervegger -->
  <!-- Stue/sov | Gang (skillevegg, kjøkken står langs øvre del) -->
  <line x1="382" y1="20" x2="382" y2="566" stroke="#1A1A18" stroke-width="13"/>
  <!-- Gang | Bad (åpning for dør y163..277) -->
  <line x1="523" y1="20" x2="523" y2="160" stroke="#1A1A18" stroke-width="13"/>
  <line x1="523" y1="280" x2="523" y2="566" stroke="#1A1A18" stroke-width="13"/>
  <!-- Bad nordvegg (mot teknisk sjakt/H0105) -->
  <line x1="523" y1="108" x2="836" y2="108" stroke="#1A1A18" stroke-width="16"/>
  <!-- Bad sørvegg -->
  <line x1="523" y1="352" x2="836" y2="352" stroke="#1A1A18" stroke-width="20"/>
  <!-- Stue/sov sørvegg (mot H0103) -->
  <line x1="34" y1="528" x2="389" y2="528" stroke="#1A1A18" stroke-width="20"/>
  <!-- Gang sørvegg (mot korridor) -->
  <line x1="382" y1="558" x2="523" y2="558" stroke="#1A1A18" stroke-width="16"/>

  <!-- Dør Gang->Bad (i skillevegg, åpning y163..277, hengslet nord, slår inn i bad) -->
  <line x1="523" y1="163" x2="523" y2="277" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 523 277 A 114 114 0 0 1 637 163" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Inngangsdør korridor->Gang (i sørvegg, åpning x430..520, hengslet øst, slår ut) -->
  <line x1="430" y1="558" x2="520" y2="558" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 430 558 A 90 90 0 0 0 520 648" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Kjøkkenbenk langs skillevegg Stue/Gang (øvre del) -->
  <rect x="322" y="35" width="60" height="220" fill="none" stroke="#1A1A18" stroke-width="1"/>
  <use href="#komfyr" x="322" y="45"/>
  <use href="#kvask" x="322" y="150"/>

  <!-- Stige til hems (langs skilleveggen, skyves ut etter behov) -->
  <g stroke="#1A1A18" stroke-width="0.9" fill="none">
    <rect x="368" y="345" width="14" height="60"/>
    <line x1="368" y1="360" x2="382" y2="360"/><line x1="368" y1="375" x2="382" y2="375"/>
    <line x1="368" y1="390" x2="382" y2="390"/>
  </g>

  <!-- Bad-innredning -->
  <use href="#wc" x="558" y="116"/>
  <!-- Servant (vid innredning) på sørvegg -->
  <use href="#servant" x="678" y="306"/>

  <!-- Møblering Stue/sov -->
  <!-- Spisebord m/stoler øvre del -->
  <use href="#bord2" x="120" y="70"/>
  <!-- Sofa + sofabord nedre del -->
  <use href="#sofa" x="90" y="430"/>

  <!-- Yttervegger -->
  <line x1="0" y1="10" x2="392" y2="10" stroke="#1A1A18" stroke-width="20"/>     <!-- nord Stue -->
  <line x1="20" y1="20" x2="20" y2="538" stroke="#1A1A18" stroke-width="41"/>    <!-- vest -->
  <line x1="850" y1="108" x2="850" y2="352" stroke="#1A1A18" stroke-width="28"/> <!-- øst (bad) -->

  <!-- Vinduer vestfasade -->
  <line x1="20" y1="81" x2="20" y2="190" stroke="#FBFAF6" stroke-width="43"/>
  <line x1="12" y1="81" x2="12" y2="190" stroke="#1A1A18" stroke-width="2"/>
  <line x1="28" y1="81" x2="28" y2="190" stroke="#1A1A18" stroke-width="2"/>
  <line x1="20" y1="296" x2="20" y2="414" stroke="#FBFAF6" stroke-width="43"/>
  <line x1="12" y1="296" x2="12" y2="414" stroke="#1A1A18" stroke-width="2"/>
  <line x1="28" y1="296" x2="28" y2="414" stroke="#1A1A18" stroke-width="2"/>

  <!-- Rom-labels -->
  <g font-family="Helvetica" fill="#1A1A18">
    <text x="200" y="290" font-size="13" text-anchor="middle">Stue/sov</text>
    <text x="200" y="307" font-size="10" text-anchor="middle" opacity="0.65">20,7 m²</text>
    <text x="452" y="360" font-size="13" text-anchor="middle">Gang</text>
    <text x="452" y="377" font-size="10" text-anchor="middle" opacity="0.65">4,1 m²</text>
    <text x="695" y="225" font-size="13" text-anchor="middle">Bad</text>
    <text x="695" y="242" font-size="10" text-anchor="middle" opacity="0.65">6,9 m²</text>
  </g>
</svg>
