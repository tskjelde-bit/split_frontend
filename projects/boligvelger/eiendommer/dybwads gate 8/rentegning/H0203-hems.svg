<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 200">
  <!-- H0203 hems: over bad + del av gang, avgrenset av skråtak-linje. ca 3,4 m².
       Mål i cm, samme orientering som hovedplan. Origo = hems NV-hjørne (= bad NV indre). -->
  <!-- Hems-flate, NV for takskrå-diagonalen -->
  <path d="M 11 11 L 382 11 L 13 195 L 11 195 Z" fill="#E5D3BC"/>
  <path d="M 11 11 L 382 11 L 13 195 L 11 195 Z" fill="none" stroke="#1A1A18" stroke-width="8"/>

  <!-- Luke/åpning mot stige (SØ, mot gang) -->
  <rect x="300" y="40" width="60" height="40" fill="none" stroke="#1A1A18"
        stroke-width="1" stroke-dasharray="4 3"/>

  <g font-family="Helvetica" fill="#1A1A18">
    <text x="150" y="80" font-size="13" text-anchor="middle">Hems</text>
    <text x="150" y="97" font-size="10" text-anchor="middle" opacity="0.65">ca 3,4 m²</text>
  </g>
</svg>
