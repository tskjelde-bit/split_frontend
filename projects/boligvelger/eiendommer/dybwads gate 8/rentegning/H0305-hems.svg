  <rect x="11" y="11" width="202" height="361" fill="none" stroke="#1A1A18" stroke-width="8"/>
  <!-- Luke/åpning mot stige (vestkant, ved bad) -->
  <rect x="16" y="170" width="60" height="40" fill="none" stroke="#1A1A18"
