<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 434 551">
  <!-- H0101: Gang 2,9 + Bad 3,4 + Stue/sov 10,9. Alle mål i cm. Origo = ytre NV-hjørne. -->

  <!-- Romflater -->
  <rect x="15" y="22" width="130" height="171" fill="#F4F1E8"/>           <!-- Gang -->
  <rect x="157" y="22" width="221" height="152" fill="#DCE2D6"/>          <!-- Bad -->
  <rect x="15" y="193" width="363" height="336" fill="#F4F1E8"/>          <!-- Stue/sov -->

  <!-- Flisraster bad (20x20) -->
  <g stroke="#1A1A18" stroke-width="0.35" opacity="0.5">
    <line x1="177" y1="22" x2="177" y2="174"/><line x1="197" y1="22" x2="197" y2="174"/>
    <line x1="217" y1="22" x2="217" y2="174"/><line x1="237" y1="22" x2="237" y2="174"/>
    <line x1="257" y1="22" x2="257" y2="174"/><line x1="277" y1="22" x2="277" y2="174"/>
    <line x1="297" y1="22" x2="297" y2="174"/><line x1="317" y1="22" x2="317" y2="174"/>
    <line x1="337" y1="22" x2="337" y2="174"/><line x1="357" y1="22" x2="357" y2="174"/>
    <line x1="157" y1="42" x2="378" y2="42"/><line x1="157" y1="62" x2="378" y2="62"/>
    <line x1="157" y1="82" x2="378" y2="82"/><line x1="157" y1="102" x2="378" y2="102"/>
    <line x1="157" y1="122" x2="378" y2="122"/><line x1="157" y1="142" x2="378" y2="142"/>
    <line x1="157" y1="162" x2="378" y2="162"/>
  </g>

  <!-- Hems-avgrensning over bad (stiplet) -->
  <rect x="151" y="22" width="227" height="152" fill="none" stroke="#1A1A18"
        stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- Innervegger -->
  <line x1="151" y1="22" x2="151" y2="112" stroke="#1A1A18" stroke-width="12"/>   <!-- gang/bad, åpning for dør y112-188 -->
  <line x1="151" y1="183" x2="434" y2="183" stroke="#1A1A18" stroke-width="19"/>  <!-- bad/stue -->

  <!-- Sisterne-nisje NØ i bad (stiplet) -->
  <rect x="320" y="22" width="58" height="48" fill="none" stroke="#1A1A18"
        stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Dør korridor->gang (i nordvegg, åpning x 14..96, hengslet vest) -->
  <line x1="14" y1="22" x2="14" y2="104" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 14 104 A 82 82 0 0 1 96 22" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Dør gang->bad (i skillevegg, åpning y 112..188, hengslet sør, slår inn i gang) -->
  <line x1="151" y1="188" x2="75" y2="188" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 75 188 A 76 76 0 0 1 151 112" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Stige til hems (gangsiden av skillevegg) -->
  <g stroke="#1A1A18" stroke-width="0.9" fill="none">
    <rect x="133" y="85" width="12" height="60"/>
    <line x1="133" y1="100" x2="145" y2="100"/><line x1="133" y1="115" x2="145" y2="115"/>
    <line x1="133" y1="130" x2="145" y2="130"/>
  </g>

  <!-- Bad-innredning -->
  <use href="#wc" x="190" y="26"/>
  <use href="#servant" x="268" y="24"/>
  <use href="#dusj" x="288" y="84"/>

  <!-- Kjøkkenbenk langs vestvegg i stue -->
  <rect x="15" y="234" width="60" height="186" fill="none" stroke="#1A1A18" stroke-width="1"/>
  <use href="#komfyr" x="15" y="244"/>
  <use href="#kvask" x="15" y="326"/>

  <!-- Møblering stue -->
  <use href="#sofa" x="205" y="218"/>
  <use href="#bord2" x="210" y="400"/>

  <!-- Yttervegger -->
  <line x1="0" y1="11" x2="434" y2="11" stroke="#1A1A18" stroke-width="22"/>
  <line x1="0" y1="540" x2="434" y2="540" stroke="#1A1A18" stroke-width="22"/>
  <line x1="7" y1="0" x2="7" y2="551" stroke="#1A1A18" stroke-width="15"/>
  <line x1="406" y1="0" x2="406" y2="551" stroke="#1A1A18" stroke-width="56"/>

  <!-- Vinduer sørfasade -->
  <line x1="45" y1="540" x2="125" y2="540" stroke="#FBFAF6" stroke-width="24"/>
  <line x1="45" y1="532" x2="125" y2="532" stroke="#1A1A18" stroke-width="2"/>
  <line x1="45" y1="548" x2="125" y2="548" stroke="#1A1A18" stroke-width="2"/>
  <line x1="215" y1="540" x2="300" y2="540" stroke="#FBFAF6" stroke-width="24"/>
  <line x1="215" y1="532" x2="300" y2="532" stroke="#1A1A18" stroke-width="2"/>
  <line x1="215" y1="548" x2="300" y2="548" stroke="#1A1A18" stroke-width="2"/>

  <!-- Rom-labels -->
  <g font-family="Helvetica" fill="#1A1A18">
    <text x="83" y="115" font-size="13" text-anchor="middle">Gang</text>
    <text x="83" y="132" font-size="10" text-anchor="middle" opacity="0.65">2,9 m²</text>
    <text x="267" y="110" font-size="13" text-anchor="middle">Bad</text>
    <text x="267" y="127" font-size="10" text-anchor="middle" opacity="0.65">3,4 m²</text>
    <text x="140" y="480" font-size="13" text-anchor="middle">Stue/sov</text>
    <text x="140" y="497" font-size="10" text-anchor="middle" opacity="0.65">10,9 m²</text>
  </g>
</svg>
