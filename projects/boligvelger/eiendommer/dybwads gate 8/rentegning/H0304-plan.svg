<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 405">
  <!-- H0304: Stue/sov 16,8 + Gang 2,9 + Bad 4,1. Alle mål i cm. Origo = ytre NV-hjørne (badets NV). -->

  <!-- Romflater -->
  <rect x="14" y="48" width="471" height="343" fill="#F4F1E8"/>          <!-- Stue/sov -->
  <rect x="485" y="48" width="153" height="216" fill="#F4F1E8"/>         <!-- Gang -->
  <rect x="665" y="8" width="201" height="206" fill="#DCE2D6"/>          <!-- Bad -->

  <!-- Flisraster bad (20x20) -->
  <g stroke="#1A1A18" stroke-width="0.35" opacity="0.5">
    <line x1="685" y1="8" x2="685" y2="214"/><line x1="705" y1="8" x2="705" y2="214"/>
    <line x1="725" y1="8" x2="725" y2="214"/><line x1="745" y1="8" x2="745" y2="214"/>
    <line x1="765" y1="8" x2="765" y2="214"/><line x1="785" y1="8" x2="785" y2="214"/>
    <line x1="805" y1="8" x2="805" y2="214"/><line x1="825" y1="8" x2="825" y2="214"/>
    <line x1="845" y1="8" x2="845" y2="214"/>
    <line x1="665" y1="28" x2="866" y2="28"/><line x1="665" y1="48" x2="866" y2="48"/>
    <line x1="665" y1="68" x2="866" y2="68"/><line x1="665" y1="88" x2="866" y2="88"/>
    <line x1="665" y1="108" x2="866" y2="108"/><line x1="665" y1="128" x2="866" y2="128"/>
    <line x1="665" y1="148" x2="866" y2="148"/><line x1="665" y1="168" x2="866" y2="168"/>
    <line x1="665" y1="188" x2="866" y2="188"/>
  </g>

  <!-- Hems-avgrensning (stiplet) over gang + bad-sone -->
  <rect x="479" y="8" width="393" height="258" fill="none" stroke="#1A1A18"
        stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- Innervegger -->
  <line x1="485" y1="48" x2="485" y2="391" stroke="#1A1A18" stroke-width="14"/>   <!-- stue/gang -->
  <line x1="652" y1="8" x2="652" y2="266" stroke="#1A1A18" stroke-width="16"/>    <!-- gang/bad, åpning øverst -->
  <line x1="638" y1="266" x2="652" y2="266" stroke="#1A1A18" stroke-width="14"/>  <!-- gang sørvegg-stubb -->

  <!-- Dør Gang->Bad (åpning øverst i gang/bad-vegg, hengslet, slår inn i bad) -->
  <line x1="652" y1="28" x2="652" y2="104" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 652 104 A 76 76 0 0 0 728 28" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Dør Korridor->Gang (inngangsdør, SØ-hjørne, slår inn i gang) -->
  <line x1="638" y1="266" x2="638" y2="190" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 638 190 A 76 76 0 0 0 562 266" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Stige til hems (NØ i stue, mot gangvegg) -->
  <g stroke="#1A1A18" stroke-width="0.9" fill="none">
    <rect x="420" y="56" width="46" height="14"/>
    <line x1="431" y1="56" x2="431" y2="70"/><line x1="442" y1="56" x2="442" y2="70"/>
    <line x1="454" y1="56" x2="454" y2="70"/>
  </g>

  <!-- Bad-innredning -->
  <use href="#wc" x="688" y="14"/>
  <use href="#servant" x="690" y="168"/>
  <use href="#dusj" x="770" y="120"/>

  <!-- Garderobeskap i gang -->
  <use href="#skap" x="540" y="130"/>

  <!-- Kjøkkenbenk langs sørvegg i stue -->
  <rect x="205" y="333" width="216" height="55" fill="none" stroke="#1A1A18" stroke-width="1"/>
  <use href="#komfyr" x="205" y="328"/>
  <use href="#kvask" x="361" y="328"/>

  <!-- Garderobeskap SV i stue (m/diagonal) -->
  <rect x="14" y="333" width="216" height="55" fill="none" stroke="#1A1A18" stroke-width="0.8"/>
  <line x1="14" y1="388" x2="230" y2="333" stroke="#1A1A18" stroke-width="0.6"/>

  <!-- Møblering stue -->
  <use href="#sofa" x="22" y="54"/>
  <use href="#bord2" x="175" y="70"/>

  <!-- Yttervegger -->
  <line x1="9" y1="48" x2="485" y2="48" stroke="#1A1A18" stroke-width="20"/>     <!-- nordvegg stue -->
  <line x1="0" y1="391" x2="638" y2="391" stroke="#1A1A18" stroke-width="20"/>   <!-- sørvegg (mot H0303) -->
  <line x1="7" y1="38" x2="7" y2="396" stroke="#1A1A18" stroke-width="28"/>      <!-- vestvegg (Dybwads gate) -->
  <line x1="658" y1="0" x2="866" y2="0" stroke="#1A1A18" stroke-width="20"/>     <!-- nordvegg bad -->
  <line x1="866" y1="0" x2="866" y2="266" stroke="#1A1A18" stroke-width="22"/>   <!-- østvegg bad -->
  <line x1="652" y1="266" x2="866" y2="266" stroke="#1A1A18" stroke-width="20"/> <!-- sørvegg bad -->

  <!-- Vindu vestfasade (Dybwads gate) -->
  <line x1="7" y1="92" x2="7" y2="345" stroke="#FBFAF6" stroke-width="30"/>
  <line x1="-1" y1="92" x2="-1" y2="345" stroke="#1A1A18" stroke-width="2"/>
  <line x1="15" y1="92" x2="15" y2="345" stroke="#1A1A18" stroke-width="2"/>

  <!-- Rom-labels -->
  <g font-family="Helvetica" fill="#1A1A18">
    <text x="245" y="225" font-size="13" text-anchor="middle">Stue/sov</text>
    <text x="245" y="242" font-size="10" text-anchor="middle" opacity="0.65">16,8 m²</text>
    <text x="560" y="180" font-size="13" text-anchor="middle">Gang</text>
    <text x="560" y="197" font-size="10" text-anchor="middle" opacity="0.65">2,9 m²</text>
    <text x="765" y="95" font-size="13" text-anchor="middle">Bad</text>
    <text x="765" y="112" font-size="10" text-anchor="middle" opacity="0.65">4,1 m²</text>
  </g>
</svg>
