<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 484 495">
  <!-- H0202: Bad 3,0 + Gang 2,8 + Stue/sov 12,9 (m/Kjøkken). Alle mål i cm.
       L-formet enhet: Bad+Gang (nord, x 104-484) over Kjøkken+Stue (sør, x 0-484).
       Origo = enhetens ytre NV-hjørne (bounding box). -->

  <!-- Romflater -->
  <!-- Bad (NV i nordfløy) -->
  <rect x="104" y="11" width="170" height="183" fill="#DCE2D6"/>
  <!-- Gang (NØ i nordfløy) -->
  <rect x="280" y="11" width="204" height="183" fill="#F4F1E8"/>
  <!-- Stue/sov + Kjøkken (hele sørfløyen) -->
  <rect x="11" y="194" width="473" height="290" fill="#F4F1E8"/>

  <!-- Flisraster bad (20x20) -->
  <g stroke="#1A1A18" stroke-width="0.35" opacity="0.5">
    <line x1="124" y1="11" x2="124" y2="194"/><line x1="144" y1="11" x2="144" y2="194"/>
    <line x1="164" y1="11" x2="164" y2="194"/><line x1="184" y1="11" x2="184" y2="194"/>
    <line x1="204" y1="11" x2="204" y2="194"/><line x1="224" y1="11" x2="224" y2="194"/>
    <line x1="244" y1="11" x2="244" y2="194"/><line x1="264" y1="11" x2="264" y2="194"/>
    <line x1="104" y1="31" x2="274" y2="31"/><line x1="104" y1="51" x2="274" y2="51"/>
    <line x1="104" y1="71" x2="274" y2="71"/><line x1="104" y1="91" x2="274" y2="91"/>
    <line x1="104" y1="111" x2="274" y2="111"/><line x1="104" y1="131" x2="274" y2="131"/>
    <line x1="104" y1="151" x2="274" y2="151"/><line x1="104" y1="171" x2="274" y2="171"/>
  </g>

  <!-- Hems-avgrensning over Bad/Gang (stiplet diagonal mønster ifølge "Hems"-tekst) -->
  <rect x="104" y="11" width="380" height="183" fill="none" stroke="#1A1A18"
        stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- Innervegger -->
  <!-- Bad/Gang skillevegg -->
  <line x1="279" y1="11" x2="279" y2="194" stroke="#1A1A18" stroke-width="12"/>
  <!-- Nordfløy sørvegg (Bad+Gang mot Kjøkken/Stue), åpning ved Gang-side -->
  <line x1="104" y1="194" x2="484" y2="194" stroke="#1A1A18" stroke-width="19"/>
  <!-- Vestvegg nordfløy (Bad) ned til L-trinn -->
  <line x1="104" y1="11" x2="104" y2="194" stroke="#1A1A18" stroke-width="14"/>

  <!-- Dør Korridor->Gang (i nordvegg, åpning x 276..367, hengslet øst, slår inn i Gang) -->
  <line x1="367" y1="11" x2="367" y2="102" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 367 102 A 91 91 0 0 1 276 11" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Dør Gang->Stue (i sørvegg nordfløy, åpning x 280..360, hengslet vest) -->
  <line x1="280" y1="194" x2="280" y2="274" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 280 274 A 80 80 0 0 0 360 194" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Skap/garderobe i Gang mot østvegg -->
  <rect x="403" y="86" width="60" height="105" fill="none" stroke="#1A1A18" stroke-width="1"/>
  <line x1="403" y1="86" x2="463" y2="191" stroke="#1A1A18" stroke-width="0.5"/>

  <!-- Stige til hems (topp av Stue, mot østre del under Gang-vegg) -->
  <g stroke="#1A1A18" stroke-width="0.9" fill="none">
    <rect x="394" y="206" width="62" height="12"/>
    <line x1="409" y1="206" x2="409" y2="218"/><line x1="424" y1="206" x2="424" y2="218"/>
    <line x1="441" y1="206" x2="441" y2="218"/>
  </g>

  <!-- Bad-innredning -->
  <use href="#wc" x="216" y="14"/>
  <use href="#servant" x="205" y="152"/>

  <!-- Kjøkken: komfyrbenk mot nordvegg i sørfløy (under Bad) -->
  <use href="#komfyr" x="110" y="206"/>

  <!-- Møblering Stue/sov -->
  <!-- Sofa langs østvegg (vertikal) -->
  <use href="#sofa" x="453" y="241" transform="rotate(90 453 241)"/>
  <!-- Sidebord (rundt) -->
  <circle cx="333" cy="290" r="25" fill="none" stroke="#1A1A18" stroke-width="1"/>
  <!-- Spisebord (rundt) m/stoler ved sør -->
  <circle cx="328" cy="447" r="33" fill="none" stroke="#1A1A18" stroke-width="1"/>
  <rect x="244" y="430" width="40" height="44" rx="6" fill="none" stroke="#1A1A18" stroke-width="0.8"/>
  <rect x="372" y="430" width="40" height="44" rx="6" fill="none" stroke="#1A1A18" stroke-width="0.8"/>

  <!-- Yttervegger -->
  <!-- Nordvegg nordfløy -->
  <line x1="104" y1="11" x2="484" y2="11" stroke="#1A1A18" stroke-width="22"/>
  <!-- L-trinn: vestvegg nordfløy allerede tegnet; nordvegg sørfløy (vestre del) -->
  <line x1="0" y1="194" x2="104" y2="194" stroke="#1A1A18" stroke-width="22"/>
  <!-- Sørvegg (gatefasade) -->
  <line x1="0" y1="484" x2="484" y2="484" stroke="#1A1A18" stroke-width="22"/>
  <!-- Vestvegg sørfløy -->
  <line x1="7" y1="194" x2="7" y2="495" stroke="#1A1A18" stroke-width="15"/>
  <!-- Østvegg (party-/54db-vegg) -->
  <line x1="473" y1="0" x2="473" y2="495" stroke="#1A1A18" stroke-width="40"/>

  <!-- Vindu sørfasade (under Stue/sov) -->
  <line x1="345" y1="484" x2="451" y2="484" stroke="#FBFAF6" stroke-width="24"/>
  <line x1="345" y1="476" x2="451" y2="476" stroke="#1A1A18" stroke-width="2"/>
  <line x1="345" y1="492" x2="451" y2="492" stroke="#1A1A18" stroke-width="2"/>

  <!-- Rom-labels -->
  <g font-family="Helvetica" fill="#1A1A18">
    <text x="190" y="100" font-size="13" text-anchor="middle">Bad</text>
    <text x="190" y="117" font-size="10" text-anchor="middle" opacity="0.65">3,0 m²</text>
    <text x="385" y="100" font-size="13" text-anchor="middle">Gang</text>
    <text x="385" y="117" font-size="10" text-anchor="middle" opacity="0.65">2,8 m²</text>
    <text x="120" y="335" font-size="10" text-anchor="middle">Kjøkken</text>
    <text x="300" y="350" font-size="13" text-anchor="middle">Stue/sov</text>
    <text x="300" y="367" font-size="10" text-anchor="middle" opacity="0.65">12,9 m²</text>
  </g>
</svg>
