<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 461 616">
  <!-- H0302: Bad 3,0 + Gang 2,7 + Stue/sov 15,6. Mål i cm. Origo = ytre NV-hjørne (px 1311,1311). 1px=1,27cm. -->

  <!-- Romflater -->
  <rect x="6" y="14" width="445" height="565" fill="#F4F1E8"/>            <!-- hele enheten base -->
  <rect x="37" y="28" width="296" height="225" fill="#DCE2D6"/>          <!-- Bad -->

  <!-- Flisraster bad (20x20) -->
  <g stroke="#1A1A18" stroke-width="0.35" opacity="0.5">
    <line x1="57" y1="28" x2="57" y2="253"/><line x1="77" y1="28" x2="77" y2="253"/>
    <line x1="97" y1="28" x2="97" y2="253"/><line x1="117" y1="28" x2="117" y2="253"/>
    <line x1="137" y1="28" x2="137" y2="253"/><line x1="157" y1="28" x2="157" y2="253"/>
    <line x1="177" y1="28" x2="177" y2="253"/><line x1="197" y1="28" x2="197" y2="253"/>
    <line x1="217" y1="28" x2="217" y2="253"/><line x1="237" y1="28" x2="237" y2="253"/>
    <line x1="257" y1="28" x2="257" y2="253"/><line x1="277" y1="28" x2="277" y2="253"/>
    <line x1="297" y1="28" x2="297" y2="253"/><line x1="317" y1="28" x2="317" y2="253"/>
    <line x1="37" y1="48" x2="333" y2="48"/><line x1="37" y1="68" x2="333" y2="68"/>
    <line x1="37" y1="88" x2="333" y2="88"/><line x1="37" y1="108" x2="333" y2="108"/>
    <line x1="37" y1="128" x2="333" y2="128"/><line x1="37" y1="148" x2="333" y2="148"/>
    <line x1="37" y1="168" x2="333" y2="168"/><line x1="37" y1="188" x2="333" y2="188"/>
    <line x1="37" y1="208" x2="333" y2="208"/><line x1="37" y1="228" x2="333" y2="228"/>
  </g>

  <!-- Hems-avgrensning (stiplet, diagonal hems over hele oppholdsrom mot SØ) -->
  <rect x="37" y="270" width="414" height="309" fill="none" stroke="#1A1A18"
        stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- Innervegger -->
  <!-- Bad/oppholdsrom-skille (horisontal) -->
  <line x1="6" y1="253" x2="333" y2="253" stroke="#1A1A18" stroke-width="14"/>
  <!-- Bad østvegg -->
  <line x1="333" y1="14" x2="333" y2="253" stroke="#1A1A18" stroke-width="12"/>
  <!-- Gang skille mot stue (kort) + sjakt-vegger -->
  <line x1="333" y1="253" x2="451" y2="253" stroke="#1A1A18" stroke-width="12"/>

  <!-- Tekniske sjakter/skap i gang (EI60) -->
  <rect x="380" y="60" width="39" height="120" fill="none" stroke="#1A1A18" stroke-width="10"/>

  <!-- Dør korridor->gang (i nordvegg over gang, hengslet, slår inn) -->
  <line x1="360" y1="14" x2="360" y2="96" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 360 96 A 82 82 0 0 1 278 14" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Dør gang->bad (i Bad østvegg, hengslet, slår inn i bad) -->
  <line x1="333" y1="200" x2="333" y2="120" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 333 120 A 80 80 0 0 0 253 200" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Stige til hems (under badveggen, ved gang) -->
  <g stroke="#1A1A18" stroke-width="0.9" fill="none">
    <rect x="305" y="258" width="55" height="14"/>
    <line x1="319" y1="258" x2="319" y2="272"/><line x1="333" y1="258" x2="333" y2="272"/>
    <line x1="347" y1="258" x2="347" y2="272"/>
  </g>

  <!-- Bad-innredning -->
  <use href="#dusj" x="46" y="40"/>                 <!-- dusj NV-hjørne -->
  <use href="#wc" x="150" y="34"/>                  <!-- WC mot nordvegg -->
  <use href="#servant" x="138" y="200"/>            <!-- servant mot sørvegg (badets sør) -->

  <!-- Kjøkkenbenk (horisontal benk rett under badveggen) -->
  <rect x="37" y="262" width="170" height="60" fill="none" stroke="#1A1A18" stroke-width="1"/>
  <use href="#komfyr" x="41" y="262"/>
  <use href="#kvask" x="103" y="262"/>

  <!-- Møblering -->
  <use href="#bord2" x="62" y="412"/>               <!-- spisebord -->
  <use href="#sofa" x="360" y="455" transform="rotate(-90 360 455)"/>   <!-- sofa langs østvegg -->
  <circle cx="318" cy="395" r="28" fill="none" stroke="#1A1A18" stroke-width="1"/>  <!-- sofabord -->

  <!-- Yttervegger -->
  <line x1="0" y1="14" x2="333" y2="14" stroke="#1A1A18" stroke-width="14"/>     <!-- nord (bad/gang mot korridor) -->
  <line x1="0" y1="603" x2="461" y2="603" stroke="#1A1A18" stroke-width="26"/>   <!-- sør (fasade) -->
  <line x1="6" y1="0" x2="6" y2="616" stroke="#1A1A18" stroke-width="13"/>       <!-- vest -->
  <line x1="451" y1="0" x2="451" y2="616" stroke="#1A1A18" stroke-width="17"/>   <!-- øst -->

  <!-- Vinduer sørfasade -->
  <line x1="32" y1="603" x2="133" y2="603" stroke="#FBFAF6" stroke-width="28"/>
  <line x1="32" y1="593" x2="133" y2="593" stroke="#1A1A18" stroke-width="2"/>
  <line x1="32" y1="613" x2="133" y2="613" stroke="#1A1A18" stroke-width="2"/>
  <line x1="356" y1="603" x2="451" y2="603" stroke="#FBFAF6" stroke-width="28"/>
  <line x1="356" y1="593" x2="451" y2="593" stroke="#1A1A18" stroke-width="2"/>
  <line x1="356" y1="613" x2="451" y2="613" stroke="#1A1A18" stroke-width="2"/>

  <!-- Rom-labels -->
  <g font-family="Helvetica" fill="#1A1A18">
    <text x="185" y="135" font-size="13" text-anchor="middle">Bad</text>
    <text x="185" y="152" font-size="10" text-anchor="middle" opacity="0.65">3,0 m²</text>
    <text x="400" y="225" font-size="13" text-anchor="middle">Gang</text>
    <text x="400" y="242" font-size="10" text-anchor="middle" opacity="0.65">2,7 m²</text>
    <text x="225" y="440" font-size="13" text-anchor="middle">Stue/sov</text>
    <text x="225" y="457" font-size="10" text-anchor="middle" opacity="0.65">15,6 m²</text>
  </g>
</svg>
