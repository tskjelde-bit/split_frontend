<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 845 805">
  <!-- H0105: Stue/sov 19,8 + Gang 5,1 + BK 2,3 + Bad 4,0. Mål i cm. Origo = ytre NV-hjørne. -->

  <!-- Romflater -->
  <rect x="20" y="20" width="342" height="555" fill="#F4F1E8"/>            <!-- Stue/sov -->
  <rect x="362" y="194" width="154" height="593" fill="#F4F1E8"/>         <!-- Gang -->
  <rect x="551" y="20" width="144" height="170" fill="#F4F1E8"/>          <!-- BK -->
  <path d="M 516 504 L 593 504 L 834 472 L 834 678 L 516 678 Z" fill="#DCE2D6"/>  <!-- Bad -->

  <!-- Flisraster bad (20x20) -->
  <g stroke="#1A1A18" stroke-width="0.35" opacity="0.5">
    <line x1="536" y1="504" x2="536" y2="678"/><line x1="556" y1="502" x2="556" y2="678"/>
    <line x1="576" y1="500" x2="576" y2="678"/><line x1="596" y1="503" x2="596" y2="678"/>
    <line x1="616" y1="501" x2="616" y2="678"/><line x1="636" y1="499" x2="636" y2="678"/>
    <line x1="656" y1="497" x2="656" y2="678"/><line x1="676" y1="495" x2="676" y2="678"/>
    <line x1="696" y1="493" x2="696" y2="678"/><line x1="716" y1="491" x2="716" y2="678"/>
    <line x1="736" y1="489" x2="736" y2="678"/><line x1="756" y1="487" x2="756" y2="678"/>
    <line x1="776" y1="485" x2="776" y2="678"/><line x1="796" y1="483" x2="796" y2="678"/>
    <line x1="816" y1="481" x2="816" y2="678"/>
    <line x1="516" y1="524" x2="834" y2="524"/><line x1="516" y1="544" x2="834" y2="544"/>
    <line x1="516" y1="564" x2="834" y2="564"/><line x1="516" y1="584" x2="834" y2="584"/>
    <line x1="516" y1="604" x2="834" y2="604"/><line x1="516" y1="624" x2="834" y2="624"/>
    <line x1="516" y1="644" x2="834" y2="644"/><line x1="516" y1="664" x2="834" y2="664"/>
  </g>

  <!-- Hems-avgrensning over Gang og sørlige del av Stue (stiplet) -->
  <rect x="40" y="450" width="476" height="337" fill="none" stroke="#1A1A18"
        stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- Innervegger -->
  <line x1="362" y1="20" x2="362" y2="787" stroke="#1A1A18" stroke-width="14"/>   <!-- Stue/Gang -->
  <line x1="551" y1="20" x2="551" y2="190" stroke="#1A1A18" stroke-width="12"/>   <!-- BK vest -->
  <line x1="551" y1="190" x2="695" y2="190" stroke="#1A1A18" stroke-width="12"/>  <!-- BK sør -->
  <line x1="695" y1="20" x2="695" y2="190" stroke="#1A1A18" stroke-width="12"/>   <!-- BK øst -->
  <line x1="362" y1="194" x2="516" y2="194" stroke="#1A1A18" stroke-width="12"/>  <!-- Gang nord (nisje) -->
  <line x1="516" y1="194" x2="516" y2="678" stroke="#1A1A18" stroke-width="14"/>  <!-- Gang/Bad -->
  <line x1="516" y1="678" x2="834" y2="678" stroke="#1A1A18" stroke-width="14"/>  <!-- Bad sør -->
  <line x1="834" y1="472" x2="834" y2="678" stroke="#1A1A18" stroke-width="14"/>  <!-- Bad øst -->
  <line x1="516" y1="504" x2="834" y2="472" stroke="#1A1A18" stroke-width="14"/>  <!-- Bad skråvegg NØ -->
  <line x1="20" y1="575" x2="362" y2="575" stroke="#1A1A18" stroke-width="14"/>   <!-- Stue sør -->
  <line x1="362" y1="787" x2="516" y2="787" stroke="#1A1A18" stroke-width="14"/>  <!-- Gang sør -->

  <!-- Hems-stige (lagret) i gang-nisjen nord -->
  <g stroke="#1A1A18" stroke-width="0.9" fill="none">
    <rect x="455" y="135" width="58" height="55"/>
    <line x1="455" y1="150" x2="513" y2="150"/>
    <line x1="455" y1="165" x2="513" y2="165"/>
    <line x1="455" y1="178" x2="513" y2="178"/>
  </g>

  <!-- Dør Stue->Gang (i nordvegg av gang, åpning x 380..470, hengslet vest, slår inn i gang) -->
  <line x1="380" y1="194" x2="380" y2="284" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 380 284 A 90 90 0 0 1 470 194" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Dør Gang->Bad (i østvegg av gang, åpning y 419..501, hengslet sør, slår inn i gang) -->
  <line x1="516" y1="419" x2="426" y2="419" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 426 419 A 90 90 0 0 0 516 509" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Dør Gang->BK (i BK sørvegg, åpning x 561..651, hengslet øst, slår ut mot trapp) -->
  <line x1="561" y1="190" x2="561" y2="100" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 561 100 A 90 90 0 0 1 651 190" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Bad-innredning: WC vest, servant nord, dusj/kabinett -->
  <use href="#wc" x="540" y="560"/>
  <use href="#servant" x="620" y="505"/>
  <use href="#dusj" x="710" y="560"/>

  <!-- Kjøkkenbenk langs nordvegg i Stue/sov -->
  <rect x="60" y="20" width="270" height="58" fill="none" stroke="#1A1A18" stroke-width="1"/>
  <use href="#komfyr" x="62" y="20"/>
  <use href="#kvask" x="240" y="20"/>

  <!-- Møblering stue -->
  <use href="#sofa" x="100" y="480"/>
  <use href="#bord2" x="120" y="150"/>

  <!-- Yttervegger -->
  <line x1="0" y1="10" x2="362" y2="10" stroke="#1A1A18" stroke-width="20"/>     <!-- nord (Stue) -->
  <line x1="362" y1="10" x2="695" y2="10" stroke="#1A1A18" stroke-width="20"/>    <!-- nord (BK) -->
  <line x1="11" y1="0" x2="11" y2="575" stroke="#1A1A18" stroke-width="22"/>      <!-- vest yttervegg (Stue) -->

  <!-- Vinduer vestfasade (mot Dybwads gate) -->
  <line x1="11" y1="100" x2="11" y2="225" stroke="#FBFAF6" stroke-width="24"/>
  <line x1="3" y1="100" x2="3" y2="225" stroke="#1A1A18" stroke-width="2"/>
  <line x1="19" y1="100" x2="19" y2="225" stroke="#1A1A18" stroke-width="2"/>
  <line x1="11" y1="334" x2="11" y2="456" stroke="#FBFAF6" stroke-width="24"/>
  <line x1="3" y1="334" x2="3" y2="456" stroke="#1A1A18" stroke-width="2"/>
  <line x1="19" y1="334" x2="19" y2="456" stroke="#1A1A18" stroke-width="2"/>

  <!-- Rom-labels -->
  <g font-family="Helvetica" fill="#1A1A18">
    <text x="200" y="300" font-size="13" text-anchor="middle">Stue/sov</text>
    <text x="200" y="317" font-size="10" text-anchor="middle" opacity="0.65">19,8 m²</text>
    <text x="439" y="430" font-size="13" text-anchor="middle">Gang</text>
    <text x="439" y="447" font-size="10" text-anchor="middle" opacity="0.65">5,1 m²</text>
    <text x="623" y="105" font-size="13" text-anchor="middle">BK</text>
    <text x="623" y="122" font-size="10" text-anchor="middle" opacity="0.65">2,3 m²</text>
    <text x="675" y="600" font-size="13" text-anchor="middle">Bad</text>
    <text x="675" y="617" font-size="10" text-anchor="middle" opacity="0.65">4,0 m²</text>
  </g>
</svg>
