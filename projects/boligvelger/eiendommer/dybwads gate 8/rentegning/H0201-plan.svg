<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 597">
  <!-- H0201: Gang 3,4 + Bad 3,7 + Stue/sov 10,8. Alle mål i cm. Origo = ytre NV-hjørne. -->

  <!-- Romflater -->
  <rect x="27" y="13" width="152" height="256" fill="#F4F1E8"/>           <!-- Gang -->
  <rect x="186" y="75" width="223" height="194" fill="#DCE2D6"/>         <!-- Bad -->
  <rect x="27" y="269" width="382" height="290" fill="#F4F1E8"/>         <!-- Stue/sov -->

  <!-- Flisraster bad (20x20) -->
  <g stroke="#1A1A18" stroke-width="0.35" opacity="0.5">
    <line x1="206" y1="75" x2="206" y2="269"/><line x1="226" y1="75" x2="226" y2="269"/>
    <line x1="246" y1="75" x2="246" y2="269"/><line x1="266" y1="75" x2="266" y2="269"/>
    <line x1="286" y1="75" x2="286" y2="269"/><line x1="306" y1="75" x2="306" y2="269"/>
    <line x1="326" y1="75" x2="326" y2="269"/><line x1="346" y1="75" x2="346" y2="269"/>
    <line x1="366" y1="75" x2="366" y2="269"/><line x1="386" y1="75" x2="386" y2="269"/>
    <line x1="406" y1="75" x2="406" y2="269"/>
    <line x1="186" y1="95" x2="409" y2="95"/><line x1="186" y1="115" x2="409" y2="115"/>
    <line x1="186" y1="135" x2="409" y2="135"/><line x1="186" y1="155" x2="409" y2="155"/>
    <line x1="186" y1="175" x2="409" y2="175"/><line x1="186" y1="195" x2="409" y2="195"/>
    <line x1="186" y1="215" x2="409" y2="215"/><line x1="186" y1="235" x2="409" y2="235"/>
    <line x1="186" y1="255" x2="409" y2="255"/>
  </g>

  <!-- Hems-avgrensning over bad (stiplet) -->
  <rect x="179" y="69" width="253" height="200" fill="none" stroke="#1A1A18"
        stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- Sisterne-nisje NØ i bad (stiplet) -->
  <rect x="360" y="75" width="49" height="50" fill="none" stroke="#1A1A18"
        stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Innervegger -->
  <line x1="179" y1="69" x2="179" y2="135" stroke="#1A1A18" stroke-width="14"/>   <!-- gang/bad, åpning for dør y135-215 -->
  <line x1="179" y1="269" x2="432" y2="269" stroke="#1A1A18" stroke-width="20"/>  <!-- bad/stue -->
  <line x1="69" y1="69" x2="179" y2="69" stroke="#1A1A18" stroke-width="11"/>     <!-- bad nordvegg -->

  <!-- Dør korridor->gang (i nordvegg, åpning x 27..115, hengslet vest) -->
  <line x1="27" y1="13" x2="27" y2="101" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 27 101 A 88 88 0 0 1 115 13" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Dør gang->bad (i skillevegg, åpning y 135..215, hengslet sør, slår inn i gang) -->
  <line x1="179" y1="215" x2="99" y2="215" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 99 215 A 80 80 0 0 1 179 135" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Stige til hems (gangsiden av skillevegg, øvre del) -->
  <g stroke="#1A1A18" stroke-width="0.9" fill="none">
    <rect x="156" y="78" width="13" height="58"/>
    <line x1="156" y1="93" x2="169" y2="93"/><line x1="156" y1="107" x2="169" y2="107"/>
    <line x1="156" y1="121" x2="169" y2="121"/>
  </g>

  <!-- Bad-innredning -->
  <use href="#wc" x="210" y="86"/>
  <use href="#servant" x="270" y="78"/>
  <use href="#dusj" x="319" y="160"/>

  <!-- Kjøkkenbenk langs vestvegg i stue -->
  <rect x="27" y="287" width="61" height="240" fill="none" stroke="#1A1A18" stroke-width="1"/>
  <use href="#komfyr" x="28" y="300"/>
  <use href="#kvask" x="28" y="384"/>

  <!-- Møblering stue -->
  <use href="#sofa" x="160" y="287"/>
  <use href="#bord2" x="190" y="430"/>

  <!-- Yttervegger -->
  <line x1="0" y1="6" x2="455" y2="6" stroke="#1A1A18" stroke-width="13"/>
  <line x1="0" y1="585" x2="455" y2="585" stroke="#1A1A18" stroke-width="25"/>
  <line x1="13" y1="0" x2="13" y2="597" stroke="#1A1A18" stroke-width="27"/>
  <line x1="432" y1="0" x2="432" y2="597" stroke="#1A1A18" stroke-width="46"/>

  <!-- Vindu sørfasade (rømningsvindu i stue) -->
  <line x1="128" y1="585" x2="230" y2="585" stroke="#FBFAF6" stroke-width="27"/>
  <line x1="128" y1="576" x2="230" y2="576" stroke="#1A1A18" stroke-width="2"/>
  <line x1="128" y1="594" x2="230" y2="594" stroke="#1A1A18" stroke-width="2"/>

  <!-- Rom-labels -->
  <g font-family="Helvetica" fill="#1A1A18">
    <text x="100" y="150" font-size="13" text-anchor="middle">Gang</text>
    <text x="100" y="167" font-size="10" text-anchor="middle" opacity="0.65">3,4 m²</text>
    <text x="300" y="178" font-size="13" text-anchor="middle">Bad</text>
    <text x="300" y="195" font-size="10" text-anchor="middle" opacity="0.65">3,7 m²</text>
    <text x="250" y="400" font-size="13" text-anchor="middle">Stue/sov</text>
    <text x="250" y="417" font-size="10" text-anchor="middle" opacity="0.65">10,8 m²</text>
  </g>
</svg>
