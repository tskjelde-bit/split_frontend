<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 270">
  <!-- H0304 hems: over gang + bad, ca 5,5 m². Mål i cm, samme orientering som hovedplan.
       Origo = gang/bad-sonens NV (svarer til plan-koord x479, y8). -->

  <!-- Hems-flate (L-form: gang-arm + bad) -->
  <path d="M 11 40 L 159 40 L 159 11 L 393 11 L 393 207 L 173 207 L 173 258 L 11 258 Z"
        fill="#E5D3BC"/>
  <path d="M 11 40 L 159 40 L 159 11 L 393 11 L 393 207 L 173 207 L 173 258 L 11 258 Z"
        fill="none" stroke="#1A1A18" stroke-width="8"/>

  <!-- Luke/åpning mot stige (SV-hjørne, ved gangvegg) -->
  <rect x="16" y="60" width="48" height="14" fill="none" stroke="#1A1A18"
        stroke-width="1" stroke-dasharray="4 3"/>

  <g font-family="Helvetica" fill="#1A1A18">
    <text x="265" y="120" font-size="13" text-anchor="middle">Hems</text>
    <text x="265" y="137" font-size="10" text-anchor="middle" opacity="0.65">ca 5,5 m²</text>
  </g>
</svg>
