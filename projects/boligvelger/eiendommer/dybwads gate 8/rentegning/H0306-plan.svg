<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 372">
  <!-- H0306: Stue/sov 16,8 + Bad 2,3 + Gang 2,3. Mål i cm. Origo = ytre NV-hjørne. Vindu i vestfasade (mot Dybwads gate-siden). -->

  <!-- Romflater -->
  <rect x="34" y="20" width="492" height="352" fill="#F4F1E8"/>            <!-- Stue/sov (vest) -->
  <rect x="526" y="20" width="178" height="167" fill="#DCE2D6"/>          <!-- Bad -->
  <rect x="526" y="187" width="178" height="185" fill="#F4F1E8"/>         <!-- Gang -->

  <!-- Flisraster bad (20x20) -->
  <g stroke="#1A1A18" stroke-width="0.35" opacity="0.5">
    <line x1="546" y1="20" x2="546" y2="187"/><line x1="566" y1="20" x2="566" y2="187"/>
    <line x1="586" y1="20" x2="586" y2="187"/><line x1="606" y1="20" x2="606" y2="187"/>
    <line x1="626" y1="20" x2="626" y2="187"/><line x1="646" y1="20" x2="646" y2="187"/>
    <line x1="666" y1="20" x2="666" y2="187"/><line x1="686" y1="20" x2="686" y2="187"/>
    <line x1="526" y1="40" x2="704" y2="40"/><line x1="526" y1="60" x2="704" y2="60"/>
    <line x1="526" y1="80" x2="704" y2="80"/><line x1="526" y1="100" x2="704" y2="100"/>
    <line x1="526" y1="120" x2="704" y2="120"/><line x1="526" y1="140" x2="704" y2="140"/>
    <line x1="526" y1="160" x2="704" y2="160"/><line x1="526" y1="180" x2="704" y2="180"/>
  </g>

  <!-- Hems-avgrensning NV (over kjøkken/sofa-sone, stiplet) -->
  <rect x="34" y="20" width="183" height="148" fill="none" stroke="#1A1A18"
        stroke-width="1.2" stroke-dasharray="6 4"/>
  <!-- Hems-avgrensning over bad (stiplet) -->
  <rect x="526" y="20" width="178" height="167" fill="none" stroke="#1A1A18"
        stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- Innervegger -->
  <line x1="526" y1="20" x2="526" y2="372" stroke="#1A1A18" stroke-width="14"/>  <!-- stue/bad+gang -->
  <line x1="526" y1="187" x2="704" y2="187" stroke="#1A1A18" stroke-width="12"/> <!-- bad/gang, dør-åpning vest -->

  <!-- Dør bad->gang (i skillevegg, hengslet vest, slår inn i gang) -->
  <line x1="538" y1="187" x2="538" y2="255" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 538 255 A 68 68 0 0 1 606 187" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Inngangsdør gang (østvegg mot trapperom, hengslet) -->
  <line x1="704" y1="300" x2="704" y2="362" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 704 362 A 62 62 0 0 1 642 300" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Stige til hems (gangens vestside, mot skillevegg) -->
  <g stroke="#1A1A18" stroke-width="0.9" fill="none">
    <rect x="528" y="300" width="14" height="62"/>
    <line x1="528" y1="315" x2="542" y2="315"/><line x1="528" y1="330" x2="542" y2="330"/>
    <line x1="528" y1="345" x2="542" y2="345"/>
  </g>

  <!-- Bad-innredning: WC (nordvegg, tank i nord) + servant (østvegg, rotert) -->
  <use href="#wc" x="645" y="22"/>
  <g transform="translate(704 130) rotate(90)"><use href="#servant" x="0" y="0"/></g>

  <!-- Kjøkkenbenk langs nordvegg i stue -->
  <rect x="250" y="20" width="216" height="60" fill="none" stroke="#1A1A18" stroke-width="1"/>
  <use href="#komfyr" x="300" y="20"/>
  <use href="#kvask" x="380" y="20"/>

  <!-- Møblering stue -->
  <use href="#sofa" x="40" y="22"/>
  <g transform="rotate(45 133 150)"><use href="#bord2" x="73" y="92"/></g>

  <!-- Yttervegger -->
  <line x1="0" y1="10" x2="712" y2="10" stroke="#1A1A18" stroke-width="20"/>      <!-- nord -->
  <line x1="8" y1="0" x2="8" y2="372" stroke="#1A1A18" stroke-width="17"/>         <!-- vest -->
  <line x1="704" y1="0" x2="704" y2="372" stroke="#1A1A18" stroke-width="16"/>     <!-- øst -->

  <!-- Vindu vestfasade -->
  <line x1="8" y1="173" x2="8" y2="347" stroke="#FBFAF6" stroke-width="19"/>
  <line x1="0" y1="173" x2="0" y2="347" stroke="#1A1A18" stroke-width="2"/>
  <line x1="16" y1="173" x2="16" y2="347" stroke="#1A1A18" stroke-width="2"/>

  <!-- Rom-labels -->
  <g font-family="Helvetica" fill="#1A1A18">
    <text x="300" y="250" font-size="13" text-anchor="middle">Stue/sov</text>
    <text x="300" y="267" font-size="10" text-anchor="middle" opacity="0.65">16,8 m²</text>
    <text x="600" y="92" font-size="13" text-anchor="middle">Bad</text>
    <text x="600" y="109" font-size="10" text-anchor="middle" opacity="0.65">2,3 m²</text>
    <text x="612" y="270" font-size="13" text-anchor="middle">Gang</text>
    <text x="612" y="287" font-size="10" text-anchor="middle" opacity="0.65">2,3 m²</text>
  </g>
</svg>
