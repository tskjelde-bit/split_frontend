<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 193">
  <!-- H0302 hems: over SØ-del av oppholdsrom, ca 3,5 m². Mål i cm, samme orientering som hovedplan. -->
  <rect x="11" y="11" width="203" height="171" fill="#E5D3BC"/>
  <rect x="11" y="11" width="203" height="171" fill="none" stroke="#1A1A18" stroke-width="8"/>
  <!-- Luke/åpning mot stige (NV-hjørne, mot Gang/Bad) -->
  <rect x="16" y="16" width="60" height="40" fill="none" stroke="#1A1A18"
        stroke-width="1" stroke-dasharray="4 3"/>
  <g font-family="Helvetica" fill="#1A1A18">
    <text x="112" y="92" font-size="13" text-anchor="middle">Hems</text>
    <text x="112" y="109" font-size="10" text-anchor="middle" opacity="0.65">ca 3,5 m²</text>
  </g>
</svg>
