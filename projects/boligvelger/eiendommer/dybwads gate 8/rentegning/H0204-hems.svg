<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 321 314">
  <!-- H0204 hems: loft over bad, ca 6 m². Mål i cm, samme orientering som hovedplan. -->
  <rect x="11" y="11" width="299" height="292" fill="#E5D3BC"/>
  <rect x="11" y="11" width="299" height="292" fill="none" stroke="#1A1A18" stroke-width="8"/>
  <!-- Skråtak-avgrensning (NV-hjørne lavere, mot stige/gang) -->
  <line x1="11" y1="180" x2="150" y2="303" stroke="#1A1A18" stroke-width="1" stroke-dasharray="6 4"/>
  <!-- Luke/åpning mot stige (SV-hjørne, gangsiden) -->
  <rect x="16" y="245" width="60" height="40" fill="none" stroke="#1A1A18"
        stroke-width="1" stroke-dasharray="4 3"/>
  <g font-family="Helvetica" fill="#1A1A18">
    <text x="180" y="150" font-size="13" text-anchor="middle">Hems</text>
    <text x="180" y="167" font-size="10" text-anchor="middle" opacity="0.65">ca 6 m²</text>
  </g>
</svg>
