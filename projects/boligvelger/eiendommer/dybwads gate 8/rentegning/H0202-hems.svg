<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 484 205">
  <!-- H0202 hems: over Bad/Gang (nordfløy), avgrenset av takfall-diagonal mot SV.
       Ca 4,4 m² målt av geometri. Mål i cm, samme orientering/origo som hovedplan. -->

  <!-- Hems-flate: polygon avgrenset av nordvegg, østvegg, sørvegg (nordfløy) og diagonal -->
  <path d="M 309 11 L 473 11 L 473 194 L 182 194 Z"
        fill="#E5D3BC"/>
  <path d="M 309 11 L 473 11 L 473 194 L 182 194 Z"
        fill="none" stroke="#1A1A18" stroke-width="8"/>

  <!-- Diagonal (takfall / hems-kant) markert stiplet -->
  <line x1="309" y1="11" x2="182" y2="194" stroke="#1A1A18"
        stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- Luke/åpning mot stige (SØ-hjørne, der stige fra Stue kommer opp) -->
  <rect x="394" y="150" width="62" height="40" fill="none" stroke="#1A1A18"
        stroke-width="1" stroke-dasharray="4 3"/>

  <g font-family="Helvetica" fill="#1A1A18">
    <text x="360" y="105" font-size="13" text-anchor="middle">Hems</text>
    <text x="360" y="122" font-size="10" text-anchor="middle" opacity="0.65">ca 4,4 m²</text>
  </g>
</svg>
