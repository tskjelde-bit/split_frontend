<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 595">
  <!-- H0203: Stue/sov 18,9 + Bad 3,8 + Gang 3,5. Alle mål i cm. Origo = ytre NV-hjørne. -->

  <!-- Romflater -->
  <!-- Stue/sov (L-form: hovedrom + kjøkkenkrok langs nordvegg) -->
  <path d="M 15 64 L 267 64 L 267 254 L 541 254 L 541 585 L 15 585 Z" fill="#F4F1E8"/>
  <rect x="15" y="9" width="252" height="55" fill="#F4F1E8"/>           <!-- kjøkkenkrok nord -->
  <rect x="267" y="64" width="218" height="190" fill="#DCE2D6"/>        <!-- Bad -->
  <rect x="485" y="44" width="159" height="210" fill="#F4F1E8"/>       <!-- Gang -->

  <!-- Flisraster bad (20x20) -->
  <g stroke="#1A1A18" stroke-width="0.35" opacity="0.5">
    <line x1="287" y1="64" x2="287" y2="254"/><line x1="307" y1="64" x2="307" y2="254"/>
    <line x1="327" y1="64" x2="327" y2="254"/><line x1="347" y1="64" x2="347" y2="254"/>
    <line x1="367" y1="64" x2="367" y2="254"/><line x1="387" y1="64" x2="387" y2="254"/>
    <line x1="407" y1="64" x2="407" y2="254"/><line x1="427" y1="64" x2="427" y2="254"/>
    <line x1="447" y1="64" x2="447" y2="254"/><line x1="467" y1="64" x2="467" y2="254"/>
    <line x1="267" y1="84" x2="485" y2="84"/><line x1="267" y1="104" x2="485" y2="104"/>
    <line x1="267" y1="124" x2="485" y2="124"/><line x1="267" y1="144" x2="485" y2="144"/>
    <line x1="267" y1="164" x2="485" y2="164"/><line x1="267" y1="184" x2="485" y2="184"/>
    <line x1="267" y1="204" x2="485" y2="204"/><line x1="267" y1="224" x2="485" y2="224"/>
  </g>

  <!-- Hems-avgrensning (stiplet, over bad+gang) -->
  <rect x="485" y="44" width="159" height="120" fill="none" stroke="#1A1A18"
        stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- Innervegger -->
  <line x1="267" y1="64" x2="267" y2="254" stroke="#1A1A18" stroke-width="14"/>  <!-- bad vest (mot kjøkken/stue), åpning for dør y160-230 -->
  <line x1="485" y1="44" x2="485" y2="254" stroke="#1A1A18" stroke-width="14"/>  <!-- bad/gang -->
  <line x1="267" y1="254" x2="644" y2="254" stroke="#1A1A18" stroke-width="14"/> <!-- bad+gang sør (mot stue) -->
  <line x1="485" y1="44" x2="567" y2="44" stroke="#1A1A18" stroke-width="12"/>   <!-- gang nord (mot korridor), dør åpning -->

  <!-- Dør gang->korridor (nordvegg gang, hengslet, slår inn) -->
  <line x1="567" y1="44" x2="567" y2="120" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 567 120 A 76 76 0 0 1 491 44" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Dør gang->bad (i bad/gang-vegg, åpning y80-156, hengslet, slår inn i gang) -->
  <line x1="485" y1="156" x2="485" y2="80" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 485 156 A 76 76 0 0 0 561 80" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Dør bad->kjøkken/stue (i bad vestvegg, åpning y160-230, hengslet, slår inn i kjøkken) -->
  <line x1="267" y1="160" x2="267" y2="230" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 267 230 A 70 70 0 0 1 197 160" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Stige til hems (gangsiden, ved sørveggen) -->
  <g stroke="#1A1A18" stroke-width="0.9" fill="none">
    <rect x="572" y="207" width="60" height="40"/>
    <line x1="572" y1="217" x2="632" y2="217"/><line x1="572" y1="227" x2="632" y2="227"/>
    <line x1="572" y1="237" x2="632" y2="237"/>
  </g>

  <!-- Bad-innredning -->
  <use href="#wc" x="291" y="68"/>
  <use href="#servant" x="368" y="64"/>

  <!-- Kjøkkenbenk langs nordvegg i kjøkkenkrok -->
  <rect x="40" y="64" width="92" height="60" fill="none" stroke="#1A1A18" stroke-width="1"/>
  <use href="#komfyr" x="40" y="64"/>
  <use href="#kvask" x="72" y="64"/>

  <!-- Møblering stue -->
  <use href="#bord2" x="130" y="375"/>
  <use href="#sofa" transform="translate(541 343) rotate(90)"/>

  <!-- Yttervegger -->
  <line x1="0" y1="4" x2="660" y2="4" stroke="#1A1A18" stroke-width="22"/>      <!-- nord -->
  <line x1="0" y1="585" x2="541" y2="585" stroke="#1A1A18" stroke-width="22"/>  <!-- sør -->
  <line x1="11" y1="0" x2="11" y2="595" stroke="#1A1A18" stroke-width="22"/>    <!-- vest -->
  <line x1="650" y1="0" x2="650" y2="254" stroke="#1A1A18" stroke-width="20"/>  <!-- gang øst -->
  <line x1="541" y1="254" x2="541" y2="595" stroke="#1A1A18" stroke-width="20"/><!-- stue øst -->

  <!-- Vinduer sørfasade -->
  <line x1="187" y1="585" x2="307" y2="585" stroke="#FBFAF6" stroke-width="24"/>
  <line x1="187" y1="577" x2="307" y2="577" stroke="#1A1A18" stroke-width="2"/>
  <line x1="187" y1="593" x2="307" y2="593" stroke="#1A1A18" stroke-width="2"/>
  <line x1="441" y1="585" x2="533" y2="585" stroke="#FBFAF6" stroke-width="24"/>
  <line x1="441" y1="577" x2="533" y2="577" stroke="#1A1A18" stroke-width="2"/>
  <line x1="441" y1="593" x2="533" y2="593" stroke="#1A1A18" stroke-width="2"/>

  <!-- Rom-labels -->
  <g font-family="Helvetica" fill="#1A1A18">
    <text x="270" y="430" font-size="13" text-anchor="middle">Stue/sov</text>
    <text x="270" y="447" font-size="10" text-anchor="middle" opacity="0.65">18,9 m²</text>
    <text x="376" y="160" font-size="13" text-anchor="middle">Bad</text>
    <text x="376" y="177" font-size="10" text-anchor="middle" opacity="0.65">3,8 m²</text>
    <text x="564" y="150" font-size="13" text-anchor="middle">Gang</text>
    <text x="564" y="167" font-size="10" text-anchor="middle" opacity="0.65">3,5 m²</text>
  </g>
</svg>
