<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 527 593">
  <!-- H0102: Bad 3,2 + Gang 2,8 + Kjøkken/Stue/sov 13,9. Alle mål i cm. Origo = ytre NV-hjørne. -->

  <!-- Romflater -->
  <!-- Kjøkken/Stue/sov (full bredde, nedre blokk) -->
  <rect x="13" y="250" width="489" height="338" fill="#F4F1E8"/>
  <!-- Gang (øvre blokk, øst for bad) -->
  <rect x="319" y="13" width="183" height="237" fill="#F4F1E8"/>
  <!-- Bad (øvre blokk, vest) -->
  <rect x="126" y="13" width="193" height="237" fill="#DCE2D6"/>

  <!-- Flisraster bad (20x20) -->
  <g stroke="#1A1A18" stroke-width="0.35" opacity="0.5">
    <line x1="146" y1="13" x2="146" y2="250"/><line x1="166" y1="13" x2="166" y2="250"/>
    <line x1="186" y1="13" x2="186" y2="250"/><line x1="206" y1="13" x2="206" y2="250"/>
    <line x1="226" y1="13" x2="226" y2="250"/><line x1="246" y1="13" x2="246" y2="250"/>
    <line x1="266" y1="13" x2="266" y2="250"/><line x1="286" y1="13" x2="286" y2="250"/>
    <line x1="306" y1="13" x2="306" y2="250"/>
    <line x1="126" y1="33" x2="319" y2="33"/><line x1="126" y1="53" x2="319" y2="53"/>
    <line x1="126" y1="73" x2="319" y2="73"/><line x1="126" y1="93" x2="319" y2="93"/>
    <line x1="126" y1="113" x2="319" y2="113"/><line x1="126" y1="133" x2="319" y2="133"/>
    <line x1="126" y1="153" x2="319" y2="153"/><line x1="126" y1="173" x2="319" y2="173"/>
    <line x1="126" y1="193" x2="319" y2="193"/><line x1="126" y1="213" x2="319" y2="213"/>
    <line x1="126" y1="233" x2="319" y2="233"/>
  </g>

  <!-- Hems-avgrensning over bad/gang (stiplet) -->
  <rect x="126" y="13" width="376" height="237" fill="none" stroke="#1A1A18"
        stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- Innervegger -->
  <line x1="126" y1="13" x2="126" y2="250" stroke="#1A1A18" stroke-width="12"/>   <!-- bad vestvegg (mot H0103) -->
  <line x1="319" y1="13" x2="319" y2="160" stroke="#1A1A18" stroke-width="12"/>   <!-- bad/gang, åpning for dør y160-235 -->
  <line x1="126" y1="250" x2="502" y2="250" stroke="#1A1A18" stroke-width="14"/>  <!-- bad+gang/stue -->

  <!-- Dør korridor->gang (i nordvegg, åpning x 350..432, hengslet vest, slår inn i gang) -->
  <line x1="350" y1="13" x2="350" y2="95" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 350 95 A 82 82 0 0 1 432 13" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Dør gang->bad (i skillevegg, åpning y 160..235, hengslet sør, slår inn i gang) -->
  <line x1="319" y1="235" x2="319" y2="160" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 319 235 A 75 75 0 0 0 394 160" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Sjakt/teknisk EI60 i gang SØ (nisje) -->
  <rect x="392" y="200" width="74" height="50" fill="none" stroke="#1A1A18"
        stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Stige til hems (stue NØ, mot østvegg) -->
  <g stroke="#1A1A18" stroke-width="0.9" fill="none">
    <rect x="444" y="259" width="55" height="14"/>
    <line x1="458" y1="259" x2="458" y2="273"/><line x1="472" y1="259" x2="472" y2="273"/>
    <line x1="486" y1="259" x2="486" y2="273"/>
  </g>

  <!-- Bad-innredning -->
  <use href="#dusj" x="129" y="40"/>
  <use href="#wc" x="252" y="62"/>
  <use href="#servant" x="234" y="200"/>

  <!-- Kjøkkenbenk langs vestvegg i kjøkken -->
  <rect x="13" y="360" width="60" height="160" fill="none" stroke="#1A1A18" stroke-width="1"/>
  <use href="#komfyr" x="13" y="378"/>
  <use href="#kvask" x="13" y="460"/>
  <!-- Kjøkkenbenk-peninsula under bad-sørvegg -->
  <rect x="100" y="258" width="115" height="58" fill="none" stroke="#1A1A18" stroke-width="1"/>

  <!-- Møblering stue -->
  <use href="#sofa" transform="translate(504 354) rotate(90)"/>
  <use href="#bord2" transform="translate(340 380) rotate(90)"/>

  <!-- Yttervegger -->
  <line x1="0" y1="13" x2="126" y2="13" stroke="#1A1A18" stroke-width="2"/>          <!-- korridorvegg bad (tynn skillevegg) -->
  <line x1="319" y1="13" x2="502" y2="13" stroke="#1A1A18" stroke-width="2"/>
  <line x1="0" y1="588" x2="502" y2="588" stroke="#1A1A18" stroke-width="11"/>        <!-- sørfasade -->
  <line x1="13" y1="250" x2="13" y2="588" stroke="#1A1A18" stroke-width="21"/>        <!-- vestvegg party (mot H0103) -->
  <line x1="514" y1="0" x2="514" y2="588" stroke="#1A1A18" stroke-width="25"/>        <!-- østvegg party (mot H0101) -->

  <!-- Korridor-skillevegg over hele bad/gang nord -->
  <line x1="126" y1="13" x2="502" y2="13" stroke="#1A1A18" stroke-width="3"/>

  <!-- Vindu sørfasade (under stue/sov) -->
  <line x1="376" y1="588" x2="489" y2="588" stroke="#FBFAF6" stroke-width="13"/>
  <line x1="376" y1="583" x2="489" y2="583" stroke="#1A1A18" stroke-width="2"/>
  <line x1="376" y1="593" x2="489" y2="593" stroke="#1A1A18" stroke-width="2"/>

  <!-- Rom-labels -->
  <g font-family="Helvetica" fill="#1A1A18">
    <text x="200" y="120" font-size="13" text-anchor="middle">Bad</text>
    <text x="200" y="137" font-size="10" text-anchor="middle" opacity="0.65">3,2 m²</text>
    <text x="400" y="135" font-size="13" text-anchor="middle">Gang</text>
    <text x="400" y="152" font-size="10" text-anchor="middle" opacity="0.65">2,8 m²</text>
    <text x="120" y="455" font-size="13" text-anchor="middle">Kjøkken</text>
    <text x="300" y="440" font-size="13" text-anchor="middle">Stue/sov</text>
    <text x="300" y="457" font-size="10" text-anchor="middle" opacity="0.65">13,9 m²</text>
  </g>
</svg>
