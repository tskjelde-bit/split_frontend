<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 678 594">
  <!-- H0103 (26,5 m²): Stue/sov 18,5 + Bad 3,4 + Gang 3,5. Hjørne Dybwads gate / Ole Fladagers gate.
       Mål i cm. Origo = enhetens ytre NV-hjørne (pikselorigo 827,1309 i full oppløsning). -->

  <!-- Romflater -->
  <!-- Stue/sov: stor L (NV kjøkkenkrok + stue/spise). Hovedflate + utsparing for bad/gang i NØ. -->
  <path d="M 23 23 H 461 V 232 H 552 V 569 H 23 Z" fill="#F4F1E8"/>
  <!-- Bad -->
  <rect x="256" y="23" width="205" height="231" fill="#DCE2D6"/>
  <!-- Gang (entre, åpent mot stue i sør) -->
  <rect x="461" y="23" width="203" height="209" fill="#F4F1E8"/>

  <!-- Flisraster bad (20x20) -->
  <g stroke="#1A1A18" stroke-width="0.35" opacity="0.5">
    <line x1="276" y1="23" x2="276" y2="254"/><line x1="296" y1="23" x2="296" y2="254"/>
    <line x1="316" y1="23" x2="316" y2="254"/><line x1="336" y1="23" x2="336" y2="254"/>
    <line x1="356" y1="23" x2="356" y2="254"/><line x1="376" y1="23" x2="376" y2="254"/>
    <line x1="396" y1="23" x2="396" y2="254"/><line x1="416" y1="23" x2="416" y2="254"/>
    <line x1="436" y1="23" x2="436" y2="254"/><line x1="456" y1="23" x2="456" y2="254"/>
    <line x1="256" y1="43" x2="461" y2="43"/><line x1="256" y1="63" x2="461" y2="63"/>
    <line x1="256" y1="83" x2="461" y2="83"/><line x1="256" y1="103" x2="461" y2="103"/>
    <line x1="256" y1="123" x2="461" y2="123"/><line x1="256" y1="143" x2="461" y2="143"/>
    <line x1="256" y1="163" x2="461" y2="163"/><line x1="256" y1="183" x2="461" y2="183"/>
    <line x1="256" y1="203" x2="461" y2="203"/><line x1="256" y1="223" x2="461" y2="223"/>
    <line x1="256" y1="243" x2="461" y2="243"/>
  </g>

  <!-- Hems-avgrensning over bad (stiplet) -->
  <rect x="256" y="23" width="205" height="231" fill="none" stroke="#1A1A18"
        stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- Innervegger -->
  <!-- Kjøkken/Bad-vegg (vest for bad) -->
  <line x1="256" y1="23" x2="256" y2="254" stroke="#1A1A18" stroke-width="14"/>
  <!-- Bad/Gang-vegg, åpning for baddør y145..232 -->
  <line x1="461" y1="23" x2="461" y2="145" stroke="#1A1A18" stroke-width="14"/>
  <line x1="461" y1="232" x2="461" y2="254" stroke="#1A1A18" stroke-width="14"/>
  <!-- Bad sørvegg -->
  <line x1="256" y1="254" x2="461" y2="254" stroke="#1A1A18" stroke-width="14"/>
  <!-- Gang sørvegg-stubber (åpent midtparti mot stue) -->
  <line x1="461" y1="232" x2="475" y2="232" stroke="#1A1A18" stroke-width="14"/>
  <line x1="545" y1="232" x2="552" y2="232" stroke="#1A1A18" stroke-width="14"/>
  <!-- Gang nordvegg, åpning for entrédør x566..643 -->
  <line x1="461" y1="29" x2="566" y2="29" stroke="#1A1A18" stroke-width="29"/>

  <!-- Stige til hems (i gang, mot østvegg) + "åpent opp" stiplet -->
  <g stroke="#1A1A18" stroke-width="0.9" fill="none">
    <rect x="500" y="200" width="80" height="14"/>
    <line x1="520" y1="200" x2="520" y2="214"/><line x1="540" y1="200" x2="540" y2="214"/>
    <line x1="560" y1="200" x2="560" y2="214"/>
  </g>

  <!-- Entrédør (gang nordvegg, åpning x566..643, hengslet øst, slår inn i gang) -->
  <line x1="643" y1="29" x2="643" y2="105" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 643 105 A 76 76 0 0 1 567 29" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Baddør (bad/gang-vegg, åpning y145..232, hengslet nord, slår ut i gang) -->
  <line x1="461" y1="232" x2="548" y2="232" stroke="#1A1A18" stroke-width="1"/>
  <path d="M 548 232 A 87 87 0 0 0 461 145" fill="none" stroke="#1A1A18" stroke-width="0.7"/>

  <!-- Bad-innredning -->
  <use href="#wc" x="289" y="67"/>
  <use href="#servant" x="404" y="45"/>

  <!-- Kjøkken: L-benk langs nordvegg (NV) + DW-kolonne ned mot bad -->
  <rect x="23" y="29" width="226" height="60" fill="none" stroke="#1A1A18" stroke-width="1"/>
  <rect x="189" y="89" width="60" height="141" fill="none" stroke="#1A1A18" stroke-width="1"/>
  <use href="#komfyr" x="47" y="29"/>
  <use href="#kvask" x="189" y="29"/>

  <!-- Møblering stue -->
  <!-- Spisebord m/4 stoler (2+2), mot vest -->
  <rect x="98" y="377" width="142" height="74" fill="none" stroke="#1A1A18" stroke-width="1.2"/>
  <g fill="none" stroke="#1A1A18" stroke-width="0.8">
    <rect x="112" y="355" width="45" height="18" rx="4"/>
    <rect x="181" y="355" width="45" height="18" rx="4"/>
    <rect x="112" y="455" width="45" height="18" rx="4"/>
    <rect x="181" y="455" width="45" height="18" rx="4"/>
  </g>
  <!-- Sofa (mot østvegg), liten lenestol + sidebord -->
  <use href="#sofa" x="542" y="370" transform="rotate(90 542 370)"/>
  <circle cx="413" cy="441" r="28" fill="none" stroke="#1A1A18" stroke-width="0.9"/>
  <rect x="385" y="478" width="48" height="48" rx="4" transform="rotate(45 409 502)"
        fill="none" stroke="#1A1A18" stroke-width="0.9"/>

  <!-- Yttervegger -->
  <line x1="0" y1="14" x2="664" y2="14" stroke="#1A1A18" stroke-width="29"/>   <!-- nord party-vegg -->
  <line x1="0" y1="569" x2="552" y2="569" stroke="#1A1A18" stroke-width="50"/> <!-- sør (Ole Fladagers gate) -->
  <line x1="23" y1="0" x2="23" y2="594" stroke="#1A1A18" stroke-width="46"/>   <!-- vest (Dybwads gate) -->
  <line x1="664" y1="0" x2="664" y2="232" stroke="#1A1A18" stroke-width="27"/> <!-- øst party-vegg (gang) -->
  <line x1="552" y1="232" x2="552" y2="594" stroke="#1A1A18" stroke-width="20"/> <!-- øst party-vegg (stue) -->
  <line x1="552" y1="232" x2="664" y2="232" stroke="#1A1A18" stroke-width="20"/> <!-- innhakk-vegg mot H0102 -->

  <!-- Vinduer vestfasade (Dybwads gate) -->
  <line x1="23" y1="211" x2="23" y2="347" stroke="#FBFAF6" stroke-width="48"/>
  <line x1="15" y1="211" x2="15" y2="347" stroke="#1A1A18" stroke-width="2"/>
  <line x1="31" y1="211" x2="31" y2="347" stroke="#1A1A18" stroke-width="2"/>

  <!-- Vinduer sørfasade (Ole Fladagers gate) -->
  <line x1="189" y1="569" x2="301" y2="569" stroke="#FBFAF6" stroke-width="52"/>
  <line x1="189" y1="561" x2="301" y2="561" stroke="#1A1A18" stroke-width="2"/>
  <line x1="189" y1="577" x2="301" y2="577" stroke="#1A1A18" stroke-width="2"/>
  <line x1="430" y1="569" x2="542" y2="569" stroke="#FBFAF6" stroke-width="52"/>
  <line x1="430" y1="561" x2="542" y2="561" stroke="#1A1A18" stroke-width="2"/>
  <line x1="430" y1="577" x2="542" y2="577" stroke="#1A1A18" stroke-width="2"/>

  <!-- Rom-labels -->
  <g font-family="Helvetica" fill="#1A1A18">
    <text x="150" y="180" font-size="13">Kjøkken</text>
    <text x="358" y="135" font-size="13" text-anchor="middle">Bad</text>
    <text x="358" y="152" font-size="10" text-anchor="middle" opacity="0.65">3,4 m²</text>
    <text x="562" y="120" font-size="13" text-anchor="middle">Gang</text>
    <text x="562" y="137" font-size="10" text-anchor="middle" opacity="0.65">3,5 m²</text>
    <text x="300" y="300" font-size="13" text-anchor="middle">Stue/sov</text>
    <text x="300" y="317" font-size="10" text-anchor="middle" opacity="0.65">18,5 m²</text>
  </g>
</svg>
